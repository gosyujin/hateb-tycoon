name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stamp build info and cache-bust assets
        run: |
          SHA="${GITHUB_SHA::7}"
          # アプリ本体(data/を除く)を最後に変更したコミットとその日時(JST)。
          # クライアントはcodeVersionだけを比較して新バージョンの有無を判断し(データ更新
          # だけのデプロイでは変わらない)、フッターにもこの組を「アプリの版」として表示する。
          APP_PATHS="index.html css js service-worker.js"
          CODE_VERSION="$(git log -1 --abbrev=7 --format=%h -- $APP_PATHS)"
          TIME="$(TZ='Asia/Tokyo' git log -1 --date=format-local:'%Y-%m-%d %H:%M:%S' --format=%cd -- $APP_PATHS)"
          cat > js/build-info.js <<EOF
          window.BUILD_INFO = { sha: '${SHA}', codeVersion: '${CODE_VERSION}', time: '${TIME}' };
          EOF
          sed -i "s/\.js\"><\/script>/.js?v=${SHA}\"><\/script>/g" index.html
          sed -i "s/style\.css\">/style.css?v=${SHA}\">/" index.html
          sed -i "s/__BUILD_SHA__/${SHA}/" service-worker.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
