name: Fetch Hatena hotentry data

on:
  schedule:
    # 毎時ちょうど(:00 / :30)はGitHub Actions全体で最も混雑し、
    # スケジュール実行が遅延・スキップされやすいため、あえて:07/:37にずらす
    # (GitHub公式ドキュメント推奨: https://docs.github.com/actions/using-workflows/events-that-trigger-workflows#schedule)
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-hotentry
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch hotentry RSS and write data/*.json
        run: python3 scripts/fetch_hotentry.py

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update hotentry data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            # concurrencyグループがあっても、ほぼ同時にdispatchされた別の実行と
            # pushが競合することがあるため、rejectされたらrebaseして数回リトライする。
            pushed=false
            for i in 1 2 3 4 5; do
              if git push; then
                pushed=true
                break
              fi
              echo "push rejected (attempt $i), rebasing onto latest main and retrying..."
              git fetch origin main
              git rebase origin/main
              sleep $((RANDOM % 4 + 1))
            done
            if [ "$pushed" != "true" ]; then
              echo "push failed after retries" >&2
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 既定のGITHUB_TOKENでのpushは他ワークフローのpushトリガーを連鎖発火しない
      # (無限ループ防止のためのGitHub Actions仕様)ため、Pagesの再デプロイを明示的に起動する。
      - name: Trigger Pages redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
